name: Check course docs are in sync

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-course-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run doc-sync check
        run: node scripts/check-course-docs.js
